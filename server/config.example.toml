# Home Display sunucu ayarları. Bu dosyayı config.toml olarak kopyalayın.

[display]
width = 600          # Kindle 4: 600x800
height = 800
rotate = 0           # 0 = dikey; 90 / 270 = yatay kullanım
title = "Ev"
timezone = "Europe/Istanbul"

[server]
host = "0.0.0.0"
port = 8080
cache_seconds = 60   # aynı görüntü bu süre içinde tekrar üretilmez

[weather]
enabled = true
latitude = 41.0082   # İstanbul
longitude = 28.9784
city = "İstanbul"

[calendar]
enabled = false
# Google Takvim > Ayarlar > "iCal biçiminde gizli adres"
ics_urls = []
days_ahead = 7
max_events = 6

[currency]
enabled = true
base = "TRY"
symbols = ["USD", "EUR"]

[home_assistant]
enabled = false
url = "http://homeassistant.local:8123"
token = ""           # Profil > Uzun ömürlü erişim jetonu
# Ekranda gösterilecek sensörler: [etiket, entity_id]
sensors = [
  ["Salon", "sensor.salon_sicaklik"],
  ["Nem", "sensor.salon_nem"],
]

[todo]
enabled = true
# Basit yapılacaklar listesi: server/todo.txt dosyasındaki her satır bir madde
file = "todo.txt"
max_items = 5
