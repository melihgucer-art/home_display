# Panoyu her 30 dakikada bir üretir ve "display" dalına yazar.
# Kindle şu adresten çeker:
#   https://raw.githubusercontent.com/<kullanıcı>/<depo>/display/display.png
# Herkese açık depolarda GitHub Actions ücretsizdir.
name: render
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    paths: ["server/**", ".github/workflows/render.yml"]

concurrency:
  group: render
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: pip install -r server/requirements.txt
      - name: Görüntüyü üret
        env:
          CALENDAR_ICS_URLS: ${{ secrets.CALENDAR_ICS_URLS }}
        run: |
          mkdir -p out
          python3 server/home_display.py render out/display.png
      - name: display dalına yaz
        run: |
          cd out
          git init -q -b display
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          date -u +%FT%TZ > updated.txt
          git add display.png updated.txt
          git commit -qm "pano $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" display
