name: probe
on:
  push:
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: sources
        run: |
          set +e
          echo "=== fonts"; fc-list | grep -i dejavu | head -3
          echo "=== ibb package_search"
          curl -s 'https://data.ibb.gov.tr/api/3/action/package_search?q=baraj%20doluluk&rows=5' | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          for p in d['result']['results']:
              print('PKG', p['name'], '|', p['title'])
              for r in p['resources']:
                  print('   RES', r['id'], r.get('format'), r.get('datastore_active'), r.get('name'))
          "
          for id in $(curl -s 'https://data.ibb.gov.tr/api/3/action/package_search?q=baraj%20doluluk&rows=5' | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          print(' '.join(r['id'] for p in d['result']['results'] for r in p['resources'] if r.get('datastore_active')))"); do
            echo "--- $id"; curl -s "https://data.ibb.gov.tr/api/3/action/datastore_search?resource_id=$id&limit=2&sort=_id%20desc" | head -c 1500; echo
          done
          echo "=== eczane"
          curl -s -A 'Mozilla/5.0' https://www.eczaneler.gen.tr/nobetci-istanbul-kadikoy -o ecz.html; ls -la ecz.html
          grep -o 'Eczanesi' ecz.html | wc -l
          python3 - <<'PY'
          s=open('ecz.html',encoding='utf-8',errors='replace').read()
          i=s.find('Eczanesi')
          print(s[max(0,i-3000):i+2500])
          PY
          echo "=== nager"; curl -s https://date.nager.at/api/v3/NextPublicHolidays/TR | head -c 600; echo
          echo "=== truncgil"; curl -s https://finans.truncgil.com/today.json | head -c 800; echo
          echo "=== frankfurter"; curl -s 'https://api.frankfurter.app/latest?from=TRY&to=USD,EUR'; echo
          echo "=== marine"; curl -s 'https://marine-api.open-meteo.com/v1/marine?latitude=40.955&longitude=29.06&current=sea_surface_temperature,wave_height'; echo
          echo "=== aq"; curl -s 'https://air-quality-api.open-meteo.com/v1/air-quality?latitude=40.9735&longitude=29.077&current=european_aqi,pm2_5,pm10'; echo
          echo "=== kindle-dash release"
          gh release view -R pascalw/kindle-dash --json tagName,assets | head -c 1500; echo
          gh release download -R pascalw/kindle-dash -p '*' -D kd && ls -la kd && for f in kd/*; do case "$f" in *.tgz|*.tar.gz) tar tzf "$f" | head -40;; *.zip) unzip -l "$f" | head -40;; esac; done
        env:
          GH_TOKEN: ${{ github.token }}
